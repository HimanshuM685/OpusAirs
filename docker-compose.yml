services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon postgres URI}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon postgres URI}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
