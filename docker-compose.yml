services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon postgres URI}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon postgres URI}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_long_random_string}
    ports:
      - "3000:3000"
